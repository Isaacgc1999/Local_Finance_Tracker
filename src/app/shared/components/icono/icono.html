<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 18 18"
  fill="none"
  stroke="currentColor"
  stroke-width="1.6"
  stroke-linecap="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('dashboard') {
      <rect x="2" y="2" width="6" height="6" rx="1.5" />
      <rect x="10" y="2" width="6" height="6" rx="1.5" />
      <rect x="2" y="10" width="6" height="6" rx="1.5" />
      <rect x="10" y="10" width="6" height="6" rx="1.5" />
    }
    @case ('movimientos') {
      <line x1="3" y1="4.5" x2="15" y2="4.5" />
      <line x1="3" y1="9" x2="15" y2="9" />
      <line x1="3" y1="13.5" x2="11" y2="13.5" />
    }
    @case ('cuentas') {
      <rect x="2" y="4" width="14" height="10.5" rx="2" />
      <line x1="2" y1="7.5" x2="16" y2="7.5" />
      <line x1="5" y1="11.5" x2="8" y2="11.5" />
    }
    @case ('objetivos') {
      <circle cx="9" cy="9" r="6.5" />
      <circle cx="9" cy="9" r="3.5" />
      <circle cx="9" cy="9" r="0.6" />
    }
    @case ('ahorros') {
      <path d="M3 8.5c0-2.5 2.5-4.5 5.5-4.5h1c3 0 5.5 2 5.5 4.5S12.5 13 9.5 13H8.5C5.5 13 3 11 3 8.5Z" />
      <line x1="7" y1="2.5" x2="11" y2="2.5" />
      <line x1="6" y1="13" x2="6" y2="15.5" />
      <line x1="12" y1="13" x2="12" y2="15.5" />
    }
    @case ('inversiones') {
      <polyline points="2,13.5 6.5,9 9.5,11.5 16,4.5" />
      <polyline points="11.5,4.5 16,4.5 16,9" />
    }
    @case ('analitica') {
      <rect x="2.5" y="9" width="3.5" height="6.5" rx="1" />
      <rect x="7.5" y="5" width="3.5" height="10.5" rx="1" />
      <rect x="12.5" y="2.5" width="3.5" height="13" rx="1" />
    }
    @case ('ia') {
      <circle cx="9" cy="9" r="6.5" />
      <circle cx="9" cy="9" r="2.2" />
    }
    @case ('ajustes') {
      <circle cx="9" cy="9" r="3" />
      <line x1="9" y1="1.5" x2="9" y2="4" />
      <line x1="9" y1="14" x2="9" y2="16.5" />
      <line x1="1.5" y1="9" x2="4" y2="9" />
      <line x1="14" y1="9" x2="16.5" y2="9" />
    }
  }
</svg>
