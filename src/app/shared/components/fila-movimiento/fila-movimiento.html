<button
  type="button"
  class="fila"
  [attr.aria-label]="event().concept + ', ' + tipo() + ', ' + origen() + ', ' + importe() + ', ' + meta()"
  [attr.aria-current]="estado() === 'activo' ? 'true' : null"
  [disabled]="estado() === 'deshabilitada'"
  (click)="onClick()"
>
  <span class="avatar num" aria-hidden="true">{{ iniciales() }}</span>
  <span class="texto">
    <span class="cabeza">
      <span class="concepto">{{ event().concept }}</span>
      <span class="pastilla pastilla--tipo">{{ tipo() }}</span>
      <span class="pastilla pastilla--origen" [class]="'pastilla pastilla--origen origen-' + event().source">{{ origen() }}</span>
    </span>
    <span class="meta">{{ meta() }}</span>
  </span>
  <span class="importe num">{{ importe() }}</span>
</button>
