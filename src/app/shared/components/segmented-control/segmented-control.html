@for (option of options(); track option.value) {
  <button
    type="button"
    role="radio"
    class="segmento"
    [class.activo]="option.value === value()"
    [attr.aria-checked]="option.value === value()"
    [attr.tabindex]="option.value === value() || (activeIndex() < 0 && $first) ? 0 : -1"
    [disabled]="disabled() || option.disabled"
    (click)="select(option)"
  >
    {{ option.label }}
  </button>
}
