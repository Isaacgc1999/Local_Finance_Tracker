<div class="cabecera">
  <span class="titulo">Gasto por semana</span>
  @if (movil()) {
    <span class="pista">desliza →</span>
  } @else {
    <div class="leyenda">
      @for (item of leyenda; track item.label) {
        <span class="leyenda__item"><span class="leyenda__cuadro" [style.background]="item.color"></span>{{ item.label }}</span>
      }
    </div>
  }
</div>
<div class="area" [class.area--scroll]="movil()">
  <div class="grafico" [chart]="option()" [style.width]="movil() ? anchoMovil() : null" role="img" aria-label="Gasto por semana del mes, apilado por tipo de gasto"></div>
</div>
