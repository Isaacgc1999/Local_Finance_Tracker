<div class="cabecera">
  <span class="titulo">{{ titulo() }}</span>
  @if (variante() === 'mobile') {
    <span class="pista">desliza →</span>
  } @else {
    <div class="leyenda">
      @for (item of leyenda(); track item.label) {
        <span class="leyenda__item"><span class="leyenda__cuadro" [style.background]="item.color"></span>{{ item.label }}</span>
      }
    </div>
  }
</div>
<div class="area" [class.area--movil]="variante() === 'mobile'" [scrollEnd]="vista()">
  <div class="grafico" [chart]="option()" chartId="analytics-comparativa" [style.width]="ancho()" role="img" aria-label="Ingresos, gastos e inversión por periodo"></div>
</div>
