[package]
name = "fintrack"
version = "0.1.0"
description = "Fintrack — finanzas personales de escritorio, local y offline"
authors = ["Fintrack"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nombre distinto del binario para evitar colisiones en Windows.
name = "fintrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# `unsafe-headers` permite quitar la cabecera Origin: Ollama responde 403 a
# `Origin: http://tauri.localhost`, que es el origen de la webview en Windows.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# Misma versión que usa tauri-plugin-sql 2.x, para operar sobre su pool.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
